
<footer class="cm-footer">

    <!-- HOME BUTTON -->
    <a href="index.html" class="cm-footer__home">

        <img
            src="assets/icons/iconHome.svg"
            alt=""
            class="cm-footer__home-icon"
        >

        <span>HOME</span>

    </a>


    <!-- CENTER TEXT -->
    <span class="cm-footer__branding">
        COPENHAGEN MARATHON
    </span>


    <!-- LANGUAGE SELECTOR -->
    <div
        class="cm-footer__languages"
        role="group"
        aria-label="Select language"
    >

        <!-- DANISH -->
        <button
            class="cm-language-btn"
            type="button"
            data-lang="da"
            aria-pressed="false"
        >

            <svg
                class="cm-flag"
                viewBox="0 0 36 26"
                aria-hidden="true"
            >
                <rect width="36" height="26" fill="#C8102E"/>
                <path
                    d="M13 0V26M0 13H36"
                    stroke="#FFFFFF"
                    stroke-width="4"
                />
            </svg>

            <span>DK</span>

        </button>


        <!-- ENGLISH -->
        <button
            class="cm-language-btn active"
            type="button"
            data-lang="en"
            aria-pressed="true"
        >

            <svg
                class="cm-flag"
                viewBox="0 0 60 40"
                aria-hidden="true"
            >
                <rect width="60" height="40" fill="#012169"/>

                <path
                    d="M0 0L60 40M60 0L0 40"
                    stroke="white"
                    stroke-width="10"
                />

                <path
                    d="M0 0L60 40M60 0L0 40"
                    stroke="#C8102E"
                    stroke-width="4"
                />

                <path
                    d="M30 0V40M0 20H60"
                    stroke="white"
                    stroke-width="13"
                />

                <path
                    d="M30 0V40M0 20H60"
                    stroke="#C8102E"
                    stroke-width="6"
                />
            </svg>

            <span>EN</span>

        </button>

    </div>

</footer>
