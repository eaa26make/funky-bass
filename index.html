
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | Copenhagen Marathon</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/sleeper.css">

    <script src="scripts/sleeper.js" defer></script>
</head>

<body class="sleeper-page" data-page="sleeper">

    <main class="sleeper-screen">

        <!-- ================================= -->
        <!-- BACKGROUND VIDEO                  -->
        <!-- ================================= -->

        <video
            class="sleeper-video"
            id="sleeperVideo"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            aria-hidden="true"
        >
            <source
                src="assets/img/Sleeperpage.mov"
                type="video/quicktime"
            >
        </video>


        <!-- DARK VIDEO OVERLAY -->
        <div class="sleeper-overlay"></div>


        <!-- ================================= -->
        <!-- MAIN CONTENT                      -->
        <!-- ================================= -->

        <div class="sleeper-content">

            <!-- COPENHAGEN MARATHON TITLE -->
            <h1 class="sleeper-title">

                <span>COPENHAGEN</span>

                <span>
                    MARATHON<sup>®</sup>
                </span>

            </h1>


            <!-- OFFICIAL MARATHON LOGO MARK -->
            <div class="sleeper-mark-window">

                <img
                    src="assets/img/copenhagen-marathon-logo-mark.png"
                    alt=""
                    class="sleeper-logo"
                >

            </div>


            <!-- ================================= -->
            <!-- PRESS THE SCREEN                  -->
            <!-- ================================= -->

            <div class="sleeper-instruction">

                <h2>PRESS THE SCREEN</h2>

                <!-- YELLOW LINE -->
                <div class="sleeper-line"></div>


                <!-- ANIMATED TOUCH BUTTON -->
                <div class="touch-circle">

                    <div class="touch-circle-inner">

                        <div class="touch-dot"></div>

                    </div>

                </div>

            </div>

        </div>


        <!-- ================================= -->
        <!-- CLICKABLE SCREEN                   -->
        <!-- ================================= -->

        <button
            class="sleeper-enter"
            id="enterKiosk"
            type="button"
            aria-label="Press to enter the Copenhagen Marathon kiosk"
        ></button>

    </main>

</body>
</html>
