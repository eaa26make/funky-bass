
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Course Info | Copenhagen Marathon</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/trails.css">

    <script src="scripts/shared.js" defer></script>
    <script src="scripts/trails.js" defer></script>
</head>

<body data-page="trails">

    <!-- SHARED HEADER -->
    <div id="site-header"></div>

    <main class="trails-main">

        <!-- ROUTE TIMELINE -->
        <section class="route-timeline widget">

            <h2 class="route-heading">
                ROUTE - 42,195 KILOMETERS
            </h2>

            <div class="timeline-stage">

                <div class="timeline-track"></div>

                <!-- START -->
                <div class="timeline-terminal timeline-start">
                    <div class="terminal-dot"></div>
                    <div class="terminal-tick"></div>
                    <span>START</span>
                </div>

                <!-- FINISH -->
                <div class="timeline-terminal timeline-finish">
                    <div class="terminal-dot"></div>
                    <div class="terminal-tick"></div>
                    <span>FINISH</span>
                </div>

                <!-- DISTANCE MARKERS -->
                <div
                    class="distance-marker"
                    style="--position:25%"
                >
                    <span class="distance-tick"></span>
                    <span>10</span>
                </div>

                <div
                    class="distance-marker"
                    style="--position:50%"
                >
                    <span class="distance-tick"></span>
                    <span>20</span>
                </div>

                <div
                    class="distance-marker"
                    style="--position:75%"
                >
                    <span class="distance-tick"></span>
                    <span>30</span>
                </div>

                <!-- FOOD STATIONS -->
                <div
                    class="timeline-food-stop"
                    style="--position:22%"
                >
                    <img
                        src="assets/icons/iconFood.svg"
                        alt="Food station"
                    >
                </div>

                <div
                    class="timeline-food-stop"
                    style="--position:55%"
                >
                    <img
                        src="assets/icons/iconFood.svg"
                        alt="Food station"
                    >
                </div>

                <div
                    class="timeline-food-stop"
                    style="--position:81%"
                >
                    <img
                        src="assets/icons/iconFood.svg"
                        alt="Food station"
                    >
                </div>

                <!-- DYNAMIC TIMELINE MARKERS -->
                <div
                    id="timelineStations"
                    class="timeline-stations"
                    aria-hidden="true"
                ></div>

            </div>
        </section>


        <!-- INTERACTIVE STATION SELECTIONS -->
        <section
            class="station-filters"
            aria-label="Route station filters"
        >

            <!-- WATER -->
            <button
                type="button"
                class="station-filter"
                data-filter="water"
                aria-pressed="false"
            >
                <img
                    src="assets/icons/iconWater.svg"
                    alt=""
                    class="station-filter-icon"
                >

                <span>WATER</span>

                <span class="station-filter-circle"></span>
            </button>

            <!-- SPORT DRINK -->
            <button
                type="button"
                class="station-filter is-active"
                data-filter="drink"
                aria-pressed="true"
            >
                <img
                    src="assets/icons/iconDrink.svg"
                    alt=""
                    class="station-filter-icon"
                >

                <span>SPORT DRINK</span>

                <span class="station-filter-circle"></span>
            </button>

            <!-- FOOD -->
            <button
                type="button"
                class="station-filter"
                data-filter="food"
                aria-pressed="false"
            >
                <img
                    src="assets/icons/iconFood.svg"
                    alt=""
                    class="station-filter-icon"
                >

                <span>FOOD</span>

                <span class="station-filter-circle"></span>
            </button>

        </section>


        <!-- INTERACTIVE ROUTE MAP -->
        <section class="route-map-card">

            <img
                src="assets/img/Route.jpeg"
                alt="Copenhagen Marathon course route"
                class="route-map-image"
            >

            <h2 class="route-map-heading">
                ROUTE MAP
            </h2>

            <!-- JS ADDS SELECTED STATION PINS -->
            <div
                id="mapPins"
                class="route-map-pins"
                aria-hidden="true"
            ></div>

        </section>

    </main>

    <!-- SHARED FOOTER -->
    <div id="site-footer"></div>

</body>
</html>
