
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Map | Copenhagen Marathon</title>

    <!-- CORRECT CSS PATHS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/trails.css">

    <!-- CORRECT JAVASCRIPT PATHS -->
    <script src="scripts/shared.js" defer></script>
    <script src="scripts/trails.js" defer></script>
</head>

<body data-page="trails" data-header-title="COURSE MAP">

    <!-- SHARED HEADER -->
    <div id="site-header"></div>

    <main class="trails-main">

        <!-- ROUTE TITLE -->
        <section class="route-title-card">
            <h1>ROUTE - 42,195 KILOMETERS</h1>
        </section>

        <!-- COURSE MAP -->
        <section class="route-map-card" aria-label="Marathon course map">

            <img
                src="assets/img/Route.jpg"
                alt="Map of the Copenhagen Marathon route"
                class="route-map-image"
            >

            <h2 class="route-map-heading">ROUTE MAP</h2>

            <!-- RED STARTING POINT -->
            <div class="route-start-point" aria-hidden="true"></div>

            <!-- INTERACTIVE STATION ICONS -->
            <div
                id="mapPins"
                class="route-map-pins"
                aria-hidden="true"
            ></div>

        </section>

        <!-- STATION FILTERS -->
        <section
            class="station-filters"
            aria-label="Select facilities along the route"
        >

            <!-- WATER -->
            <button
                type="button"
                class="station-filter"
                data-filter="water"
                aria-pressed="false"
            >
                <img
                    src="assets/icons/iconWater.svg"
                    alt=""
                    class="station-filter-icon"
                >

                <span class="station-filter-label">
                    WATER
                </span>

                <span class="station-filter-circle"></span>
            </button>

            <!-- SPORT DRINK -->
            <button
                type="button"
                class="station-filter"
                data-filter="drink"
                aria-pressed="false"
            >
                <img
                    src="assets/icons/iconDrink.svg"
                    alt=""
                    class="station-filter-icon"
                >

                <span class="station-filter-label">
                    SPORT DRINK
                </span>

                <span class="station-filter-circle"></span>
            </button>

            <!-- FOOD -->
            <button
                type="button"
                class="station-filter"
                data-filter="food"
                aria-pressed="false"
            >
                <img
                    src="assets/icons/iconFood.svg"
                    alt=""
                    class="station-filter-icon"
                >

                <span class="station-filter-label">
                    FOOD
                </span>

                <span class="station-filter-circle"></span>
            </button>

            <!-- TOILET -->
            <button
                type="button"
                class="station-filter"
                data-filter="toilet"
                aria-pressed="false"
            >
                <img
                    src="assets/icons/iconToilet.svg"
                    alt=""
                    class="station-filter-icon"
                >

                <span class="station-filter-label">
                    TOILET
                </span>

                <span class="station-filter-circle"></span>
            </button>

        </section>

    </main>

</body>
</html>
